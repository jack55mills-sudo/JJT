<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="description" content="A calmer way to share a home." />
    <title>Goodhouse — Willow House</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-frame">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-view="home" aria-label="Goodhouse home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span>goodhouse</span>
        </a>

        <div class="house-switcher">
          <span class="eyebrow">YOUR HOUSE</span>
          <div class="house-name"><span class="house-dot"></span><span>Willow House</span><span class="chevron">⌄</span></div>
          <div class="roommate-stack" aria-label="4 roommates">
            <span class="avatar avatar-sage">A</span><span class="avatar avatar-rose">M</span><span class="avatar avatar-blue">J</span><span class="avatar avatar-gold">S</span>
            <span class="roommate-count">4 roommates</span>
          </div>
        </div>

        <nav class="nav-list">
          <span class="eyebrow nav-label">HOUSE</span>
          <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-view="chores"><span class="nav-icon">◷</span>Chore rhythm<span class="nav-badge" id="pendingBadge">2</span></button>
          <button class="nav-item" data-view="rules"><span class="nav-icon">✳</span>Our agreement</button>
          <span class="eyebrow nav-label nav-label-spaced">EVERYTHING ELSE</span>
          <button class="nav-item" data-view="details"><span class="nav-icon">▤</span>House details</button>
          <button class="nav-item" data-view="vault"><span class="nav-icon">▧</span>Deposit vault</button>
          <button class="nav-item" data-view="costs"><span class="nav-icon">＄</span>Shared costs</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="quiet-note"><span class="quiet-spark">✳</span><p>A good week is one where nobody needs to open the app.</p></div>
          <button class="profile-button"><span class="avatar avatar-sage">A</span><span><strong>Alex Morgan</strong><small>House organizer</small></span><span class="more">···</span></button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>WILLOW HOUSE</span><span class="crumb-slash">/</span><strong id="currentSection">OVERVIEW</strong></div>
          <div class="topbar-actions">
            <span class="demo-pill"><span></span> DEMO HOUSEHOLD</span>
            <button class="icon-button" aria-label="Notifications" title="Notifications">♧<i></i></button>
            <span class="avatar avatar-sage top-avatar" aria-label="Alex Morgan">A</span>
          </div>
        </header>

        <div id="pageContent" class="page-content"></div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  </body>
</html>
